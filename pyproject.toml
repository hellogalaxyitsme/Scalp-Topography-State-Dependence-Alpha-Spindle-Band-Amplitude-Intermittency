[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ampint"
version = "1.0.0"
description = "Stochastic normal-form inference of alpha and spindle-band amplitude intermittency from scalp EEG"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jasmeet Singh Bindra" },
    { name = "Siddharth Panwar" },
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numba>=0.60",
    "joblib>=1.4",
    "mne>=1.8",
    "statsmodels>=0.14",
    "antropy>=0.2",
    "openpyxl>=3.1",
]

[tool.setuptools]
packages = ["ampint"]
